[tools]
"github:sass/dart-sass" = "1.107.1"
"github:wjdp/htmltest" = "latest"
hugo = "0.169"
node = "lts"

[env]
_.path = ['{{config_root}}/node_modules/.bin']

[env.HUGO_VERSION]
value = """{{ exec(command='hugo version') \
    | split(pat=' ') \
    | nth(n=1) \
    | split(pat='-') \
    | first \
    | trim }}"""
tools = true

[env.NODE_VERSION]
value = "{{ exec(command='node --version') }}"
tools = true

[tasks.clean]
run = "rm -rf bin public resources tmp"

[tasks.format]
run = "prettier --write ."

[tasks.dev]
run = "hugo serve -D"

[tasks.htmltest]
depends = ["build"]
run = "htmltest -c htmltest.yml"
